[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "wip-ingestion"
version = "0.1.0"
description = "Workforce Intelligence Platform — HR Data Ingestion Pipeline"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==2.9.1",
    "dbt-core==1.8",
    "dbt-postgres>=1.9.1",
    "faker>=40.54.0",
    "flask>=2.2.5",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pyairtable>=3.5.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",  # required by templater = "dbt" below
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running Docker infrastructure",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "docker/*"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
sql_file_exts = ".sql"
max_line_length = 100  # match ruff's line-length (E501 ignored above)
# Rules disabled to preserve the intentional house style of these dbt models:
#   LT01/LT02 — column-aligned `as` clauses and the indentation that follows
#   RF04      — natural column names that are SQL keywords (date, level, stage, …)
#   ST06/ST09 — select-target and join ordering are organised for readability
#   AM06      — mix of positional and named GROUP BY references
exclude_rules = "LT01,LT02,RF04,ST06,ST09,AM06"
